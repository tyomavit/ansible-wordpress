---
- name: Настройка бэкэнд сервера Apache
  hosts: web
  become: true

  # 1. Установка Apache и включение модуля rewrite.
  # 2. Перевод Apache на внутренний порт 8080 (ports.conf), создание document root.
  # 3. Виртуальный хост из шаблона, активация сайта и удаление дефолтного хоста.
  # 4. Установка PHP с расширениями и клиента MySQL (для диагностики).
  # 5. Скачивание и распаковка WordPress только при его отсутствии (проверка по index.php).
  # 6. wp-config.php из шаблона: данные подключения к БД, ключи и соли из vault, права 0640.
  # 7. Проверка конфига Apache, немедленный перезапуск и проверка ответа на 127.0.0.1:8080.
  # 8. UFW: порт 8080 открыт только для IP сервера Proxy.
  #    Базовые правила файрвола (запрет входящих, SSH) заданы в baseline.yml.

  tasks:
    - name: Установка Apache и обновление кэша пакетов
      ansible.builtin.apt:
        name: apache2
        state: present
        update_cache: yes
        lock_timeout: 300

    - name: Активация модуля rewrite
      community.general.apache2_module:
        name: rewrite
        state: present
      notify: Перезапуск Apache

    - name: Корректировка ports.conf
      ansible.builtin.template:
        src: templates/web_ports_conf.j2
        dest: /etc/apache2/ports.conf
        mode: '0644'
      notify: Перезапуск Apache

    - name: Создание директории document root
      ansible.builtin.file:
        path: "/var/www/{{ domain_name }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Создание конфигурации виртуального хоста
      ansible.builtin.template:
        src: web_sites_conf.j2
        dest: "/etc/apache2/sites-available/{{ domain_name }}.conf"
        owner: root
        group: root
        mode: "0644"
      notify: Перезапуск Apache

    - name: Активация виртуального хоста
      ansible.builtin.file:
        src: "/etc/apache2/sites-available/{{ domain_name }}.conf"
        dest: "/etc/apache2/sites-enabled/{{ domain_name }}.conf"
        state: link

    - name: Деактивация дефолтной конфигурации
      ansible.builtin.file:
        path: /etc/apache2/sites-enabled/000-default.conf
        state: absent

    - name: Проверка, что Apache запущен и включен
      ansible.builtin.systemd:
        name: apache2
        state: started
        enabled: yes

    - name: Установка PHP и необходимых расширений
      ansible.builtin.apt:
        name:
          - php
          - libapache2-mod-php
          - php-mysql
          - php-cli
          - php-curl
          - php-gd
          - php-mbstring
          - php-xml
          - php-zip
          - php-intl
          - php-bcmath
        state: present
        lock_timeout: 300
      notify: Перезапуск Apache

    - name: Установка клиента MySQL (для диагностики)
      ansible.builtin.apt:
        name: mysql-client
        state: present
        lock_timeout: 300

    - name: Проверка, существует ли WordPress
      ansible.builtin.stat:
        path: "/var/www/{{ domain_name }}/index.php"
      register: wp_check

    - name: Скачивание архива WordPress
      ansible.builtin.get_url:
        url: https://wordpress.org/latest.tar.gz
        dest: /tmp/wordpress.tar.gz
      when: not wp_check.stat.exists

    - name: Распаковка WordPress в папку сайта
      ansible.builtin.unarchive:
        src: /tmp/wordpress.tar.gz
        dest: "/var/www/{{ domain_name }}"
        owner: www-data
        group: www-data
        remote_src: true
        extra_opts:
        - --strip-components=1
      when: not wp_check.stat.exists

    - name: Настройка wp-config.php
      ansible.builtin.template:
        src: web_php.j2
        dest: "/var/www/{{ domain_name }}/wp-config.php"
        owner: www-data
        group: www-data
        mode: "0640"
      notify: Перезапуск Apache

    - name: Проверка конфигурации Apache
      ansible.builtin.command: apache2ctl configtest
      changed_when: false

    - name: Применение отложенных изменений (перезапуск Apache)
      ansible.builtin.meta: flush_handlers

    - name: Проверка, что Apache отвечает на внутреннем порту
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ web_port_for_proxy }}/"
        follow_redirects: none
        status_code: [200, 301, 302]

    - name: Разрешить доступ для Proxy (port 8080/tcp)
      community.general.ufw:
        rule: allow
        from: "{{ proxy_ip_address }}"
        port: "8080"
        proto: tcp        

  handlers:
    - name: Перезапуск Apache
      ansible.builtin.service:
        name: apache2
        state: restarted